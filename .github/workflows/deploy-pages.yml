name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Los permisos que pide la plantilla oficial de GitHub para publicar en
# Pages: lectura del código, escritura en Pages y el token de OIDC que
# `actions/deploy-pages` usa para autenticarse contra la API de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y publicación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # `configure-pages` prepara el sitio de Pages: comprueba que existe,
      # lo habilita si hace falta y expone la configuración de la build.
      # Va antes de subir el artefacto porque es la action que deja el
      # sitio de Pages en un estado coherente con un build por workflow.
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
