name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

# Una despliegue a la vez: dos despliegues concurrentes al mismo sitio
# pueden dejar publicada una versión anterior por encima de la nueva.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y publicación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # La publicación va por la API de Pages (`POST /pages/builds`) en vez
      # de por `actions/deploy-pages`.
      #
      # Motivo: `actions/deploy-pages` no intercambia el artefacto con el
      # runner por el endpoint interno de Actions, sino que pide una URL
      # firmada a `pipelinesghubeus5.actions.githubusercontent.com`. Ese
      # endpoint devuelve 404 en esta instancia de GitHub ("Cannot find
      # any run with github.run_id …"), y la acción falla al publicar
      # aunque el artefacto se haya subido bien.
      #
      # La API de Pages es la vía soportada para publicar un sitio
      # estático: recibe un tarball con el contenido del sitio y lo
      # sirve. Es la misma operación, sin el intercambio de artefactos.
      - name: Publicar en GitHub Pages
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # El tarball lleva el contenido del sitio en la raíz: `dist/`
          # con un `index.html` por locale.
          tar -czf "$RUNNER_TEMP/pages.tar.gz" -C dist .
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" \
            --input "$RUNNER_TEMP/pages.tar.gz" \
            -H "Content-Type: application/gzip" \
            --jq '.url'

      - name: Resumen
        run: |
          {
            echo "### Deploy a GitHub Pages"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${{ steps.deploy.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
