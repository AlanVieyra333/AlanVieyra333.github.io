name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Una despliegue a la vez: dos despliegues concurrentes al mismo sitio
# pueden dejar publicada una versión anterior por encima de la nueva.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y publicación
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # La publicación va por la rama `gh-pages`, que es la fuente que
      # GitHub Pages sirve.
      #
      # Por qué no `actions/deploy-pages`: esa action no toma el artefacto
      # del runner, pide una URL firmada al servicio interno de Actions
      # (`pipelinesghubeus5.actions.githubusercontent.com`). En esta
      # instancia de GitHub ese endpoint devuelve 404 y la action falla
      # al publicar aunque el artefacto se haya subido bien. Tampoco
      # sirve `POST /pages/builds`: aquí el endpoint decodifica el
      # cuerpo como JSON en vez de tratarlo como un tarball.
      #
      # Publicar la rama directamente no depende de ninguno de los dos
      # servicios: es el mismo modelo clásico de GitHub Pages.
      - name: Publicar en la rama gh-pages
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/site"
          rm -rf "$SITE"
          cp -R dist "$SITE"
          # `.nojekyll` desactiva el procesamiento de Jekyll que Pages
          # aplica por defecto: el sitio se sirve tal cual.
          touch "$SITE/.nojekyll"

          cd "$SITE"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build: publish the portfolio site (${GITHUB_SHA})"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages

      - name: Resumen
        run: |
          {
            echo "### Deploy a GitHub Pages"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Rama: \`gh-pages\`"
            echo "- URL: https://alanvieyra333.github.io/"
          } >> "$GITHUB_STEP_SUMMARY"
